<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PageSure">
  <!--
    A single "P" and the cobalt period from the wordmark. A two-letter monogram does not survive
    16px, so the mark keeps only what reads at tab size. Ink tile, canvas glyph and the accent,
    matching --color-ink, --color-canvas and --color-accent in globals.css; the dark tile keeps
    the glyph legible on both light and dark tab bars.
  -->
  <rect width="32" height="32" rx="7" fill="#1c1917" />
  <path fill="#faf8f5" fill-rule="evenodd" d="M8 7.5h8.5a6.25 6.25 0 0 1 0 12.5H12.6v4.5H8V7.5Zm4.6 4.1v4.3h3.9a2.15 2.15 0 0 0 0-4.3h-3.9Z" />
  <circle cx="24.6" cy="22.4" r="2.4" fill="#2f53e0" />
</svg>
